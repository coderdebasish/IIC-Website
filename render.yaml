services:
  - type: web
    name: iic-iem-website
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: iic@iem.edu.in
      - key: DJANGO_SUPERUSER_PASSWORD
        value: AdminPass123!
      - key: DATABASE_URL
        fromDatabase:
          name: iic-iem-db
          property: connectionString

databases:
  - name: iic-iem-db
    databaseName: iic_iem_db
    user: iic_admin
    plan: free
